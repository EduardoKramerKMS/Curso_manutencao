<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eff6ff">
    <title>Entrar | Curso de manutenção</title>
    <link rel="stylesheet" href="/css/login.css">
  </head>
  <script>
  document.getElementById('login-form').addEventListener('submit', e => {
    e.preventDefault();
    // TEMPORÁRIO: só para navegar durante o desenvolvimento.
    // Não valida nada. O login real será feito no C#.
    window.location.href = 'inicio.html';
  });
</script>
  <body>
    <main class="login-page">
      <section class="login-card" aria-labelledby="login-title">
        <header class="login-header">
          <div class="login-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="m2.5 9 9.5-5 9.5 5-9.5 5-9.5-5Z"></path>
              <path d="M6.5 11.1v4.2c3.4 2.6 7.6 2.6 11 0v-4.2"></path>
              <path d="M21.5 9v6"></path>
            </svg>
          </div>
          <h1 id="login-title">Curso de manutenção</h1>
          <p>Acesse seu painel administrativo escolar</p>
        </header>

        <form id="login-form" class="login-form" action="#" method="post">
          <div class="form-field">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="username">
          </div>

          <div class="form-field">
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" autocomplete="current-password">
          </div>

          <a class="forgot-password" href="#">Esqueceu sua senha?</a>
        </form>

        <div class="login-actions">
          <button type="submit" form="login-form">Entrar</button>
          <p>Uso restrito a funcionários autorizados.</p>
        </div>
      </section>
    </main>
  </body>
</html>
