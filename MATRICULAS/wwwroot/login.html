<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eff6ff">
  <title>Entrar | Curso de manutenção</title>
  <link rel="stylesheet" href="/css/login.css">
</head>

<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <header class="login-header">
        <div class="login-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="m2.5 9 9.5-5 9.5 5-9.5 5-9.5-5Z"></path>
            <path d="M6.5 11.1v4.2c3.4 2.6 7.6 2.6 11 0v-4.2"></path>
            <path d="M21.5 9v6"></path>
          </svg>
        </div>
        <h1 id="login-title">Curso de manutenção</h1>
        <p>Acesse seu painel administrativo escolar</p>
      </header>

      <!-- method="post" deve ficar: se o JavaScript falhar, a senha não vai parar na barra de endereço -->
      <form id="login-form" class="login-form" action="#" method="post">
        <div class="form-field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="username">
        </div>

        <div class="form-field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password">
        </div>

        <p id="erro-login" role="alert" style="color:#b91c1c;font-size:14px;min-height:1.2em;margin:.5rem 0 0"></p>
        <a class="forgot-password" href="#">Esqueceu sua senha?</a>
      </form>

      <div class="login-actions">
        <button type="submit" form="login-form">Entrar</button>
        <p>Uso restrito a funcionários autorizados.</p>
      </div>
    </section>
  </main>

  <!-- O script fica DEPOIS do formulário, senão o formulário ainda não existe quando ele roda -->
  <script>
    const formLogin = document.getElementById('login-form');
    const erro = document.getElementById('erro-login');
    const botao = document.querySelector('button[form="login-form"]');

    formLogin.addEventListener('submit', async e => {
      e.preventDefault();   // impede o envio padrão do navegador
      erro.textContent = '';

      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('password').value;
      if (!email || !senha) { erro.textContent = 'Informe e-mail e senha.'; return; }

      botao.disabled = true;
      botao.textContent = 'Entrando...';
      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });
        if (resp.ok) { window.location.href = 'inicio.html'; return; }
        erro.textContent = resp.status === 401
          ? 'E-mail ou senha incorretos.'
          : 'Não foi possível entrar. Tente novamente.';
      } catch {
        erro.textContent = 'Sem conexão com o servidor.';
      } finally {
        botao.disabled = false;
        botao.textContent = 'Entrar';
      }
    });
  </script>
</body>

</html>
