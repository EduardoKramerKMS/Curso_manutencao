</head>

<body>

        </svg></div>

    </div>
    <nav>
      <a href="inicio.html"><svg viewBox="0 0 24 24">
          <path d="M3 10.5 12 3l9 7.5V21H3z" />
        </svg>Início</a>
      <div class="menu-alunos">
        <a href="adicionar.html" class="ativo"><svg viewBox="0 0 24 24">
            <circle cx="9" cy="8" r="4" />

          </svg>Alunos

          <a href="adicionar.html">Adicionar Aluno</a>
          <a href="editar.html">Editar Aluno</a>

        </div>
      </div>
      <a href="#"><svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
        </svg>Configurações</a>
      <a />

  <div class="principal">
    <header>
      <div>
        <h1>Cadastrar Aluno</h1>
        <p>Adicionar um novo aluno no sistema escolar.</p>
      </div>
      <div class="usuario">
        <button class="sino" aria-label="Notificações"><svg viewBox="0 0 24 24">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0" />
          </svg></button>
        <span class="selo">Administrador</span>
        <button type="button" id="sair" class="btn cancelar">Sair</button>
      </div>
    </header>

    <main>
      <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

      <div class="caminho">Alunos <svg viewBox="0 0 24 24">
          <path d="m9 6 6 6-6 6" />
        </svg> <b>Cadastrar</b></div>

      <form class="cartao" id="form" novalidate>
        <h2>Informações Gerais</h2>
        <div class="grade">
          <div class="linha1">
            <div>
              <label for="nome">Nome completo</label>
              <input type="text" id="nome" placeholder="Ex: João Silva de Souza" maxlength="100" autocomplete="off">
              <div class="msg-erro" id="erro-nome"></div>
            </div>
            <div>
              <label for="idade">Idade</label>
              <input type="number" id="idade" placeholder="Ex: 16" min="5" max="100">
              <div class="msg-erro" id="erro-idade"></div>
            </div>
          </div>

          <div>
            <label for="serie">Série escolar</label>
            <select id="serie">
              <option value="">Selecione a série...</option>
              <option>6ºEF</option>
              <option>7ºEF</option>
              <option>8ºEF</option>
              <option>9ºEF</option>
              <option>1ªEM</option>
              <option>2ªEM</option>
              <option>3ªEM</option>
            </select>
            <div class="msg-erro" id="erro-serie"></div>
          </div>

          <fieldset>
            <legend>Situação da matrícula</legend>
            <div class="radios">
              <label><input type="radio" name="situacao" value="matriculado" checked> Matriculado</label>
              <label><input type="radio" name="situacao" value="nao_matriculado"> Não matriculado</label>
            </div>
          </fieldset>
        </div>

        <div class="acoes">
          <button type="button" class="btn cancelar" id="cancelar">Cancelar</button>
          <button type="submit" class="btn salvar" id="salvar">Cadastrar Aluno</button>
        </div>
      </form>
    </main>
  </div>

  <script>

    async function salvarAluno(aluno) {
      const resp = await fetch('/api/alunos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(aluno)
      });

      let erro = null;
      if (!resp.ok) {
        try {
          const msg = JSON.parse(await resp.text());
          erro = typeof msg === 'string' ? msg : 'Erro no servidor.';
        } catch {
          erro = 'Erro no servidor.';
        }
      }
      return { ok: resp.ok, erro };
    }

    /* ===================== TELA ===================== */
    const $ = id => document.getElementById(id);
    const form = $('form'), aviso = $('aviso'), botao = $('salvar');
    let temporizador;

    function mostrarAviso(texto, tipo) {
      clearTimeout(temporizador);
      const icone = tipo === 'ok'
        ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>'
        : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>';
      aviso.className = 'aviso mostrar ' + tipo;
      aviso.innerHTML = icone;
      const span = document.createElement('span');
      span.textContent = texto;            // textContent evita injeção de HTML
      aviso.appendChild(span);
      temporizador = setTimeout(() => aviso.classList.remove('mostrar'), 5000);
    }

    function marcarErro(campo, erroId, texto) {
      $(campo).classList.toggle('invalido', !!texto);
      $(erroId).textContent = texto || '';
      return !texto;
    }

    function validar() {
      const nome = $('nome').value.trim();
      const idade = Number($('idade').value);
      const okNome = marcarErro('nome', 'erro-nome', nome.length < 3 ? 'Informe o nome completo.' : '');
      const okIdade = marcarErro('idade', 'erro-idade',
        (!$('idade').value || idade < 5 || idade > 100) ? 'Idade entre 5 e 100.' : '');
      const okSerie = marcarErro('serie', 'erro-serie', !$('serie').value ? 'Escolha a série.' : '');
      return okNome && okIdade && okSerie;
    }

    function limpar() {
      form.reset();
      ['nome', 'idade', 'serie'].forEach(c => marcarErro(c, 'erro-' + c, ''));
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      if (!validar()) return;

      botao.disabled = true;
      botao.textContent = 'Salvando...';
      try {
        const resultado = await salvarAluno({
          nome: $('nome').value.trim(),
          idade: Number($('idade').value),
          serie: $('serie').value,
          matriculado: form.situacao.value === 'matriculado'
        });
        if (resultado.ok) {
          mostrarAviso('Aluno cadastrado com sucesso!', 'ok');
          limpar();
        } else {
          mostrarAviso(resultado.erro || 'Não foi possível cadastrar o aluno.', 'falha');
        }
      } catch {
        mostrarAviso('Sem conexão com o servidor. Tente novamente.', 'falha');
      } finally {
        botao.disabled = false;
        botao.textContent = 'Cadastrar Aluno';
      }
    });

    $('cancelar').addEventListener('click', limpar);
  </script>
</body>

</html>
